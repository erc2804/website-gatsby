[build]
  functions = "netlify/functions"

[dev]
  command = "gatsby develop"
  framework = "#custom"
  targetPort = 8000
  port = 8888


[[headers]]
  for = "/.netlify/functions/*"
    [headers.values]
      Access-Control-Allow-Origin = "https://www.ercancicek.com"
      Access-Control-Allow-Methods = "POST"
      Access-Control-Allow-Headers = "Content-Type"